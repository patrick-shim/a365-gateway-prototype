[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a365-gateway-agent"
version = "1.0.0"
description = "Azure OpenAI CLI agent with Purview DLP and Agent 365 telemetry"
requires-python = ">=3.11"

[project.scripts]
a365-gateway-agent = "a365_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
