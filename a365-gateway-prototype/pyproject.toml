[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a365-observability-gateway"
version = "1.0.0"
description = "Agent 365 observability and Microsoft Purview DLP gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "microsoft-agents-activity>=1.3.0,<2",
  "microsoft-agents-authentication-msal>=1.3.0,<2",
  "microsoft-opentelemetry>=1.3.7,<2",
  "msal>=1.35.1,<2",
  "opentelemetry-api>=1.33.0,<2",
  "python-dotenv>=1.0.0,<2",
  "truststore>=0.10.0,<1",
]

[project.scripts]
a365-observability-gateway = "obs_gateway.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
